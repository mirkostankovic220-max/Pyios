<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 PyIOS - Python in Browser</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>🐍 PyIOS</h1>
            <div class="header-buttons">
                <button onclick="runCode()" id="runBtn">▶ Run</button>
            </div>
        </header>

        <div id="editorPage">
            <textarea id="code" spellcheck="false">print("Hello from PyIOS! 👋")

name = input("What is your name? ")
print(f"Hello, {name}! Welcome to PyIOS.")

for i in range(5):
    print(f"Counting: {i}")

print("All done!")</textarea>

            <div class="buttons">
                <button onclick="runCode()">▶ Run Python</button>
                <button onclick="saveCode()">💾 Save</button>
                <button onclick="downloadCode()">⬇ Export</button>
                <button onclick="clearEditor()">🗑 Clear</button>
            </div>
        </div>

        <div id="terminal">
            <div class="terminalTop">
                <span>Terminal</span>
                <button onclick="closeTerminal()">✕</button>
            </div>
            <pre id="output"></pre>
            <div class="input-line">
                <span id="prompt">>>> </span>
                <input id="terminalInput" 
                       autocomplete="off"
                       onkeydown="handleInput(event)">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
